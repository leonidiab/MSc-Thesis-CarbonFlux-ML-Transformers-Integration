[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nee-cross-site-classification"
version = "1.0.0"
description = "Carbon flux (NEE) classification via cross-site validation with tree-based and transformer models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["carbon flux", "NEE", "cross-site validation", "machine learning", "tabular transformers"]

dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.26",
    "scikit-learn>=1.4,<2.0",
    "optuna>=3.6,<4.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.3,<5.0",
    "pytorch-tabular>=1.1,<2.0",
    "torch>=2.2,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "joblib>=1.3,<2.0",
    "pyyaml>=6.0,<7.0",
    "xlsxwriter>=3.2,<4.0",
    "pydantic>=2.0,<3.0",
    "flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
nee-train = "nee_classification.scripts.train:main"
nee-test = "nee_classification.scripts.test_cross_site:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]

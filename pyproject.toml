[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nee-cross-site-classification"
version = "1.0.0"
description = "Carbon flux (NEE) classification via cross-site validation with tree-based and transformer models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["carbon flux", "NEE", "cross-site validation", "machine learning", "tabular transformers"]

dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.26",
    "scikit-learn>=1.4,<2.0",
    "optuna>=3.6,<4.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.3,<5.0",
    "pytorch-tabular>=1.1,<2.0",
    "torch>=2.2,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "joblib>=1.3,<2.0",
    "pyyaml>=6.0,<7.0",
    "xlsxwriter>=3.2,<4.0",
    "pydantic>=2.0,<3.0",
    "flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
nee-train = "nee_classification.scripts.train:main"
nee-test = "nee_classification.scripts.test_cross_site:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
ignore-paths = ["^tests/.*$"]

[tool.pylint.messages_control]
disable = [
    "invalid-name",                # Allows ML standard variables like X, y, X_train, etc.
    "import-outside-toplevel",     # Allows importing heavy frameworks dynamically inside functions
    "duplicate-code",             # Allows similar code in training scripts/models
    "too-many-locals",             # Allowed for complex pipeline functions
    "too-many-statements",         # Allowed for long orchestrator/runner functions
    "too-many-arguments",          # Allowed for passing multiple configuration parameters
    "too-many-instance-attributes",# Allowed for rich orchestrator/dataset state classes
    "broad-exception-caught",      # Allowed for standard exception catching in run loops
    "import-error",                # Allows pylint to run successfully without installing heavy dependencies
    "line-too-long",               # Already handled by ruff, redundant in pylint
    "too-many-branches",           # Allowed for scripts/orchestration flow control logic
    "wrong-import-position",       # Allowed for scripts setting up path before importing local modules
    "no-member",                   # Prevents false positives with dynamic packages (e.g. Pydantic, PyTorch)
    "too-few-public-methods",      # Config/Model classes often contain only one method (run)
    "unused-import",               # Already handled by ruff
    "unused-variable",             # Already handled by ruff
    "unused-argument",             # Allowed when conforming to external interfaces
    "trailing-whitespace",         # Redundant, handled by IDE/ruff
    "missing-final-newline",       # Redundant, handled by IDE/ruff
    "unsupported-membership-test", # Solves false positives on dynamic container attributes
    "consider-using-max-builtin",  # Allows explicit conditional checks for readability
    "consider-using-min-builtin",  # Allows explicit conditional checks for readability
    "missing-module-docstring",    # Web/scripts don't require module-level docstrings
    "logging-fstring-interpolation",# Allows standard f-strings in logging calls
    "cell-var-from-loop",          # Allows loops with lambdas executing synchronously
    "no-else-return",              # Allows explicit else blocks after return for code branching clarity
    "too-many-nested-blocks",      # Allowed for complex server routes and logic blocks
    "too-many-return-statements",  # Allowed for early-exit validation in web endpoints
]

